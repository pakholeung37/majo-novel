name: Addon release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test independent runtime assemblies and generator without Godot
        run: ./tools/test.sh --independent

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot .NET on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_mono_linux_x86_64.zip
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          mkdir -p "$RUNNER_TEMP/godot-download" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot-download"
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          printf '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  %s\n' "$archive" > godot.sha256
          sha256sum --check godot.sha256
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          godot_binary="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)"
          test -n "$godot_binary"
          chmod +x "$godot_binary"
          printf 'GODOT_BIN=%s\n' "$godot_binary" >> "$GITHUB_ENV"
      - name: Install pinned Godot .NET on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Godot_v4.7.2-stable_mono_win64.zip'
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') {
            throw 'Godot archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive $archive -DestinationPath $destination
          $binary = Get-ChildItem $destination -Recurse -Filter '*_mono_win64_console.exe' | Select-Object -First 1
          if (-not $binary) { throw 'Godot .NET console executable not found' }
          "GODOT_BIN=$($binary.FullName)" >> $env:GITHUB_ENV
      - name: Verify upstream and run full gate
        run: |
          python tools/package-addon.py --verify-only
          python tools/runtime_test_gate.py --full --output build/platform-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence-${{ matrix.os }}
          if-no-files-found: error
          path: build/platform-tests/
      - name: Build addon archives
        if: runner.os == 'Linux'
        run: python tools/package-addon.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: majo-runtime-source-addons
          if-no-files-found: error
          path: |
            build/releases/*.zip
            build/releases/SHA256SUMS
            build/releases/install.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [domain, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: majo-runtime-source-addons
          path: release-assets
      - name: Validate tag and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY_TAG'
          import os, re
          from pathlib import Path
          version = re.search(r'version="([^"]+)"', Path('addons/majo_runtime/plugin.cfg').read_text())[1]
          tag = os.environ['RELEASE_TAG']
          assert tag == 'v' + version or tag.startswith('v' + version + '-'), (tag, version)
          PY_TAG
          cd release-assets
          sha256sum --check SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.zip ./SHA256SUMS ./install.py --draft "${prerelease[@]}" \
            --title "Majo Runtime $RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/addons/majo_runtime/CHANGELOG.md"
